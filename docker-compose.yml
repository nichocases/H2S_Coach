services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: inline_hockey
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d inline_hockey"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_ENV: local
      API_KEY: development-only
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/inline_hockey
    ports:
      - "8000:8000"

volumes:
  postgres-data:
